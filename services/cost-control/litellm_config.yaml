# LiteLLM Proxy 設定檔
# 用途：Hermes / OpenClaw 費用控制路由層
# 啟動：litellm --config litellm_config.yaml --port 4000 --ui

model_list:
  # ── 快速模型（高頻雜事，最省錢）──────────────────────────
  - model_name: "fast"
    litellm_params:
      model: "claude-haiku-3-5"
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "分類、格式化、摘要、確認類任務"
      cost_per_1m_tokens: 0.25

  # ── 標準模型（日常主力）──────────────────────────────────
  - model_name: "standard"
    litellm_params:
      model: "claude-sonnet-4-5"
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "草稿、分析、規劃、一般 agent 任務"
      cost_per_1m_tokens: 3.0

  # ── 強力模型（複雜推理，謹慎使用）──────────────────────────
  - model_name: "powerful"
    litellm_params:
      model: "claude-opus-4"
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "深度推理、策略規劃、複雜程式架構"
      cost_per_1m_tokens: 15.0

  # ── 本地模型（隱私敏感 / 零成本）──────────────────────────
  - model_name: "local-coder"
    litellm_params:
      model: "ollama/qwen2.5-coder:32b"
      api_base: "http://localhost:11434"
    model_info:
      description: "程式碼生成與審查，媲美 GPT-4o，完全本地"
      cost_per_1m_tokens: 0.0

  - model_name: "local-general"
    litellm_params:
      model: "ollama/llama3.3:70b"
      api_base: "http://localhost:11434"
    model_info:
      description: "通用推理，隱私任務，完全本地"
      cost_per_1m_tokens: 0.0

  - model_name: "local-fast"
    litellm_params:
      model: "ollama/phi4:14b"
      api_base: "http://localhost:11434"
    model_info:
      description: "快速本地任務，分類與摘要"
      cost_per_1m_tokens: 0.0

  # ── 備援模型（Anthropic 掛了自動切換）───────────────────────
  - model_name: "fallback"
    litellm_params:
      model: "gpt-4o"
      api_key: os.environ/OPENAI_API_KEY

# ── 路由設定 ────────────────────────────────────────────────
router_settings:
  routing_strategy: "cost-based"
  allowed_fails: 2
  retry_after: 5
  fallbacks:
    - standard:
        - fallback
    - fast:
        - local-fast
        - standard

# ── 費用控制 ─────────────────────────────────────────────────
general_settings:
  # 月上限：超過自動降級到本地模型
  max_budget: 50           # USD
  budget_duration: "1mo"

  # 費用追蹤
  store_model_in_db: true

  # 啟用 Dashboard UI
  ui_access_mode: "all"

# ── 日誌設定 ─────────────────────────────────────────────────
litellm_settings:
  success_callback: ["langfuse"]    # 可選，接 Langfuse 做詳細追蹤
  failure_callback: ["slack"]       # 可選，失敗時 Slack 通知
